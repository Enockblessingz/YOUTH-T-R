<style>
  html{-webkit-text-size-adjust:100%} body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}

  *:focus-visible{outline:2px solid #4f46e5;outline-offset:2px}
  input,select,textarea{font-size:16px}
  .nav-item.active{background:#eef2ff;color:#4338ca;font-weight:600}
  .nav-item.active .material-symbols-outlined{color:#4f46e5}
  .skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .fade-in{animation:fadeIn .25s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
  .settings-tab-btn.active{background:#4f46e5;color:#fff}
  .settings-section{display:none}.settings-section.active{display:block}
  .settings-card{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .settings-card h3{font-weight:600;font-size:1.1rem;color:#1e293b;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
  .settings-card .field-group{margin-bottom:1.25rem}
  .settings-card label{display:block;font-size:.85rem;font-weight:500;color:#475569;margin-bottom:.3rem}
  .settings-card input,.settings-card select{width:100%;padding:.6rem .75rem;border:1px solid #d1d5db;border-radius:8px;font-size:.95rem;background:#fff}
  .settings-card .readonly-field{background:#f1f5f9;color:#475569;padding:.6rem .75rem;border-radius:8px;font-size:.95rem}
  .settings-card .save-btn{background:#4f46e5;color:#fff;padding:.6rem 1.5rem;border-radius:8px;font-weight:600;border:none;cursor:pointer}
  .settings-card .remove-photo-btn{color:#ef4444;font-size:.85rem;cursor:pointer;background:none;border:none;padding:.2rem .5rem}
  .profile-avatar-wrapper{position:relative;width:120px;height:120px;margin:0 auto}
  .profile-avatar-wrapper img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #fff}
  .profile-avatar-wrapper .avatar-fallback{width:100%;height:100%;border-radius:50%;background:#4f46e5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:800;border:4px solid #fff}
  .profile-avatar-wrapper .change-photo-btn{position:absolute;bottom:4px;right:4px;background:#4f46e5;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff}
  .messages-shell{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 220px);min-height:440px;overflow:hidden}
  .messages-directory{border-right:1px solid #e5e7eb;display:flex;flex-direction:column;min-height:0}
  .messages-thread{display:flex;flex-direction:column;min-height:0;background:#f8fafc}
  .msg-row{transition:background .15s;cursor:pointer}.msg-row:hover{background:#f1f5f9}
  .msg-row.active{background:#eef2ff;border-left:3px solid #4f46e5}
  .presence-dot{width:10px;height:10px;border-radius:50%;border:2px solid #fff;position:absolute;bottom:0;right:0}
  .presence-online{background:#22c55e}.presence-offline{background:#cbd5e1}
  #messages-nav-badge{background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:auto}
  @media (max-width:1023px){.messages-shell{grid-template-columns:1fr;height:calc(100vh - 200px)}.messages-shell.thread-open .messages-directory{display:none}.messages-shell:not(.thread-open) .messages-thread{display:none}}
  .msg-tick{font-size:11px;letter-spacing:-2px;display:inline-block}
  .msg-tick.read{color:#53bdeb}.msg-tick.delivered{color:#e5e7eb}.msg-tick.sent{color:#e5e7eb}
  .msg-bubble-row{display:flex;align-items:flex-start;gap:6px;width:100%}
  .msg-bubble-row.mine{flex-direction:row-reverse}
  .msg-bubble-col{max-width:80%;display:flex;flex-direction:column}
  .msg-bubble-row.mine .msg-bubble-col{align-items:flex-end}
  .msg-menu-btn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #e5e7eb;color:#94a3b8;cursor:pointer;flex-shrink:0;margin-top:4px}
  .msg-menu-btn:hover{background:#eef2ff;color:#4f46e5;border-color:#4f46e5}
  .msg-action-menu{position:fixed;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:4px;z-index:9000;display:flex;flex-direction:column;min-width:200px;max-height:70vh;overflow-y:auto}
  .msg-action-menu button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:500;color:#334155;background:none;border:none;cursor:pointer;text-align:left;width:100%}
  .msg-action-menu button:hover{background:#f1f5f9;color:#4f46e5}
  .msg-action-menu button.danger:hover{background:#fef2f2;color:#dc2626}
  .reaction-picker-floating{position:fixed;background:#fff;border:1px solid #e5e7eb;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;z-index:9001;display:flex;gap:2px}
  .reaction-picker-floating button{width:36px;height:36px;border-radius:50%;font-size:20px;background:transparent;border:none;cursor:pointer}
  .composer-toolbar{display:flex;gap:2px;align-items:center}
  .composer-toolbar button{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#64748b;background:transparent;border:none;cursor:pointer}
  .composer-toolbar button:hover{background:#f1f5f9;color:#4f46e5}
  .emoji-picker{position:absolute;bottom:60px;left:12px;right:12px;max-width:340px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:10px;z-index:20;display:none}
  .emoji-picker.open{display:block}
  .emoji-picker .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:220px;overflow-y:auto}
  .emoji-picker .emoji-grid button{font-size:22px;padding:6px 0;border-radius:8px;background:transparent;border:none;cursor:pointer}
  .composer-reply{display:flex;align-items:center;gap:8px;border-left:3px solid #4f46e5;background:rgba(79,70,229,.06);padding:6px 10px;border-radius:6px;margin-bottom:6px;font-size:12px}
  .composer-attachment{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:6px 10px;margin-bottom:6px;font-size:12px}
  .attach-preview{max-width:220px;border-radius:8px;overflow:hidden;margin-bottom:4px;background:#000}
  .attach-preview img{display:block;width:100%;max-height:200px;object-fit:cover;cursor:pointer}
  .msg-reply-quote{border-left:2px solid currentColor;padding:4px 8px;margin-bottom:4px;opacity:.75;border-radius:4px;cursor:pointer;font-size:12px}

  .msg-reply-quote .rq-text{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .msg-reactions{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
  .react-pill{background:#f1f5f9;border:1px solid #e5e7eb;border-radius:999px;padding:1px 6px;font-size:12px;cursor:pointer}
  .react-pill.mine{background:#eef2ff;border-color:#c7d2fe}

  @keyframes mh{0%{background:#fef3c7}100%{background:transparent}}
  .toast{position:fixed;top:16px;right:16px;z-index:999;background:#1e293b;color:#fff;padding:14px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.20);transform:translateX(120%);opacity:0;transition:all .35s;max-width:400px;display:flex;align-items:center;gap:10px}

  .toast.success{border-left:4px solid #059669}.toast.error{border-left:4px solid #ef4444}.toast.info{border-left:4px solid #4f46e5}

function openModal({ title, body, footer, size='md', onMount }) {
  const sizes = { sm:'max-w-md', md:'max-w-xl', lg:'max-w-3xl', xl:'max-w-5xl' };
  const root = $('#modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[250] bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4';
  overlay.innerHTML = `<div class="bg-white w-full ${sizes[size]||sizes.md} rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92vh] sm:max-h-[88vh] flex flex-col fade-in">
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200 flex-shrink-0">
      <h3 class="font-bold text-lg truncate pr-4">${escapeHtml(title||'')}</h3>
      <button data-close aria-label="Close" class="w-9 h-9 grid place-items-center rounded-lg hover:bg-slate-100"><span class="material-symbols-outlined text-slate-500" aria-hidden="true">close</span></button>
    </div>
    <div class="overflow-y-auto p-5 flex-1">${body||''}</div>
    ${footer ? `<div class="px-5 py-4 border-t border-slate-200 flex flex-wrap gap-2 justify-end flex-shrink-0">${footer}</div>` : ''}
  </div>`;
  root.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  const close = () => { overlay.remove(); if (!document.querySelector('#modalRoot > div')) document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  overlay.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  if (typeof onMount === 'function') onMount(overlay, close);
  return { close, root: overlay };
}

function confirmDialog({ title, message, confirmLabel='Confirm', danger=false }) {

      onMount: (el, close) => {
        el.querySelector('[data-confirm]').addEventListener('click', () => { close(); resolve(true); });

      }
    });
  });
}

function exportCSV(filename, rows, columns) {

  const header = columns.map(c => `"${c.label}"`).join(',');

  const csv = '\uFEFF' + header + '\n' + body;
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });

async function detectMemberColumns() {
  if (SCHEMA.memberCols) return SCHEMA.memberCols;

  const { data, error } = await YT.sb.from('members').select('*').limit(1);
  if (!error && data?.length) { Object.keys(data[0]).forEach(k => found.add(k)); }

      if (!e) found.add(col);
    }
    ['id','org_id','full_name','phone','email','status','created_at'].forEach(c => found.add(c));

SECTION_RENDERERS['pending-members'] = async (root) => {
  if (!canApproveMembers()) { root.innerHTML = unauthorizedState(); return; }
  if (!SCHEMA.hasApprovalStatus) {
    root.innerHTML = `${pageHeader('Pending Members','')}
      <div class="rounded-xl bg-amber-50 border border-amber-200 p-5 text-sm text-amber-800">

      </div>`;
    return;
  }
  const orgId = STATE.profile.org_id;
  const state = { rows: [], selected: new Set(), search: '' };
  root.innerHTML = `
    ${pageHeader('Pending Members', 'Approve or reject membership requests',
      `<button id="approveAllBtn" disabled class="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold px-4 py-2.5 rounded-xl text-sm"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">done_all</span>Approve selected (<span id="selCount">0</span>)</button>`)}
    <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-5 flex flex-wrap gap-3 items-center">
      <div class="flex-1 min-w-[200px]">${searchBar('Search by name, email, phone…','pendSearch')}</div>
      <button id="pendRefreshBtn" class="text-xs font-semibold text-slate-600 hover:text-brand-700 inline-flex items-center gap-1.5"><span class="material-symbols-outlined text-[16px]" aria-hidden="true">refresh</span>Refresh</button>
    </div>
    <div id="pendList"></div>`;

  async function load() {
    const wrap = $('#pendList'); wrap.innerHTML = `<div class="p-5">${loadingState(6)}</div>`;
    const { data, error } = await YT.sb.from('members').select('*').eq('org_id', orgId).eq('approval_status','Pending').order('created_at',{ascending:false}).limit(500);
    if (error) { wrap.innerHTML = errorState(error.message); return; }
    state.rows = data || [];
    render();
  }
  function render() {
    const wrap = $('#pendList');
    const q = state.search.toLowerCase();
    const filtered = q ? state.rows.filter(m => (m.full_name||'').toLowerCase().includes(q) || (m.email||'').toLowerCase().includes(q) || (m.phone||'').includes(q)) : state.rows;
    $('#selCount').textContent = state.selected.size;
    $('#approveAllBtn').disabled = state.selected.size === 0;
    if (!filtered.length) {
      wrap.innerHTML = emptyState('inbox','No pending requests', q ? 'No requests match your search.' : 'All membership requests have been reviewed.');
      return;
    }
    wrap.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 overflow-hidden"><div class="divide-y divide-slate-100">
      ${filtered.map(m => { const sel = state.selected.has(m.id);
        return `<div class="p-4 flex items-center gap-3">
          <input type="checkbox" data-psel="${m.id}" ${sel?'checked':''} aria-label="Select ${escapeHtml(m.full_name||'member')}" class="w-4 h-4 rounded border-slate-300 flex-shrink-0">
          <span class="w-10 h-10 rounded-full bg-amber-50 text-amber-700 grid place-items-center text-sm font-bold flex-shrink-0">${escapeHtml(initials(m.full_name))}</span>
          <div class="min-w-0 flex-1">
            <div class="font-semibold text-sm truncate">${escapeHtml(m.full_name || '—')}</div>
            <div class="text-xs text-slate-500 truncate">${escapeHtml(m.email || '—')}${m.phone ? ' · '+escapeHtml(m.phone) : ''}</div>
            <div class="text-xs text-slate-400 mt-0.5">Requested ${fmtDateTime(m.created_at)}</div>
          </div>
          <div class="flex gap-2 flex-shrink-0">
            <button data-approve="${m.id}" class="text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg">Approve</button>
            <button data-reject="${m.id}" class="text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg">Reject</button>
          </div>
        </div>`; }).join('')}
    </div></div>`;
    wrap.querySelectorAll('[data-psel]').forEach(cb => cb.addEventListener('change', () => {
      const id = cb.dataset.psel;
      if (cb.checked) state.selected.add(id); else state.selected.delete(id);
      render();
    }));
    wrap.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', () => approveOne(b.dataset.approve)));
    wrap.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', () => rejectOne(b.dataset.reject)));
  }
  async function approveOne(id) {
    const m = state.rows.find(r => r.id === id); if (!m) return;
    const ok = await confirmDialog({ title:'Approve member', message:`Approve ${m.full_name}? They'll gain access to their member area.`, confirmLabel:'Approve' });
    if (!ok) return;
    const { error } = await YT.sb.from('members').update({ approval_status:'Approved', account_status:'Active', approved_by: STATE.profile.id, approved_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    await writeAudit('approve_member', 'member', id, { name: m.full_name });
    toast('Member approved'); state.selected.delete(id); load();
  }
  async function rejectOne(id) {
    const m = state.rows.find(r => r.id === id); if (!m) return;
    const reason = prompt(`Reject ${m.full_name}? Optional reason:`) || null;
    const { error } = await YT.sb.from('members').update({ approval_status:'Rejected', account_status:'Rejected', rejected_reason: reason, approved_by: STATE.profile.id, approved_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id);
    if (error) { toast(error.message, 'error'); return; }
    await writeAudit('reject_member', 'member', id, { name: m.full_name, reason });
    toast('Membership rejected'); state.selected.delete(id); load();
  }
  async function approveSelected() {
    const ids = Array.from(state.selected);
    if (!ids.length) return;
    const ok = await confirmDialog({ title:'Approve selected', message:`Approve ${ids.length} member${ids.length===1?'':'s'}?`, confirmLabel:'Approve all' });
    if (!ok) return;
    const { error } = await YT.sb.from('members').update({ approval_status:'Approved', account_status:'Active', approved_by: STATE.profile.id, approved_at: new Date().toISOString() }).in('id', ids);
    if (error) { toast(error.message, 'error'); return; }
    await writeAudit('bulk_approve_members', 'member', null, { count: ids.length });
    toast(`${ids.length} member${ids.length===1?'':'s'} approved`);
    state.selected.clear(); load();
  }
  $('#pendSearch').addEventListener('input', debounce(e => { state.search = e.target.value.trim(); render(); }, 250));
  $('#pendRefreshBtn').addEventListener('click', load);
  $('#approveAllBtn').addEventListener('click', approveSelected);
  await load();
};

async function fetchMembers() {
  const wrap = $('#membersTableWrap'); if (!wrap) return;
  wrap.innerHTML = `<div class="p-5">${loadingState(6)}</div>`;
  try {
    let q = YT.sb.from('members').select('*', { count: 'exact' }).eq('org_id', STATE.profile.org_id);
    if (SCHEMA.hasApprovalStatus) q = q.neq('approval_status', 'Rejected');
    if (_membersState.search) q = q.or(`full_name.ilike.%${_membersState.search}%,phone.ilike.%${_membersState.search}%,email.ilike.%${_membersState.search}%`);
    if (_membersState.status !== 'all') q = q.eq('status', _membersState.status);
    if (_membersState.dept !== 'all') q = q.eq('department_id', _membersState.dept);
    if (SCHEMA.hasAccountStatus && _membersState.account !== 'all') q = q.eq('account_status', _membersState.account);
    const from = (_membersState.page - 1) * MEMBERS_PAGE_SIZE;
    const { data, count, error } = await q.order('created_at', { ascending: false }).range(from, from + MEMBERS_PAGE_SIZE - 1);
    if (error) throw error;
    _membersState.rows = data || []; _membersState.total = count || 0;
    renderMembersTable(); renderMembersPager();
  } catch (err) { wrap.innerHTML = errorState(err.message); }
}

function renderMembersPager() {
  const pager = $('#membersPager'); if (!pager) return;
  const pages = Math.max(1, Math.ceil(_membersState.total / MEMBERS_PAGE_SIZE));
  if (pages <= 1) { pager.innerHTML = ''; return; }
  pager.innerHTML = `<p class="text-xs text-slate-500">Page ${_membersState.page} of ${pages}</p><div class="flex gap-2"><button id="membersPrev" ${_membersState.page <= 1 ? 'disabled' : ''} class="px-3 py-2 text-sm font-semibold border border-slate-200 rounded-lg disabled:opacity-40">Prev</button><button id="membersNext" ${_membersState.page >= pages ? 'disabled' : ''} class="px-3 py-2 text-sm font-semibold border border-slate-200 rounded-lg disabled:opacity-40">Next</button></div>`;
  $('#membersPrev')?.addEventListener('click', () => { if (_membersState.page > 1) { _membersState.page--; fetchMembers(); } });
  $('#membersNext')?.addEventListener('click', () => { if (_membersState.page < pages) { _membersState.page++; fetchMembers(); } });
}

async function exportMembersCSV() {
  try {
    let q = YT.sb.from('members').select('*').eq('org_id', STATE.profile.org_id);
    if (SCHEMA.hasApprovalStatus) q = q.neq('approval_status','Rejected');
    if (_membersState.search) q = q.or(`full_name.ilike.%${_membersState.search}%,phone.ilike.%${_membersState.search}%,email.ilike.%${_membersState.search}%`);
    if (_membersState.status !== 'all') q = q.eq('status', _membersState.status);
    if (_membersState.dept !== 'all') q = q.eq('department_id', _membersState.dept);
    const { data, error } = await q.order('created_at', { ascending: false });
    if (error) throw error;
    exportCSV(`members_${new Date().toISOString().slice(0,10)}.csv`, data || [], [
      { label:'Name', value:'full_name' }, { label:'Phone', value:'phone' }, { label:'Email', value:'email' },
      { label:'Status', value:'status' }, { label:'Account Status', value:'account_status' },
      { label:'Department', value:'department_name' }, { label:'Role', value:'ministry_role' }
    ]);
  } catch (err) { toast(err.message || 'Export failed', 'error'); }
}

/* ─── Photo uploaders ─── */
async function uploadMemberPhoto(file) {
  if (typeof YT !== 'undefined' && typeof YT.uploadMedia === 'function') return await YT.uploadMedia(file, 'members');
  if (!SCHEMA.hasMediaBucket) throw new Error('media bucket missing');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `members/${STATE.profile.id}_${Date.now()}.${ext}`;
  const { error } = await YT.sb.storage.from('media').upload(path, file, { upsert:false, cacheControl:'3600' });
  if (error) throw error;
  const { data } = YT.sb.storage.from('media').getPublicUrl(path);
  return data.publicUrl;
}

async function uploadProfileAvatar(file) {
  if (typeof YT !== 'undefined' && typeof YT.uploadMedia === 'function') return await YT.uploadMedia(file, 'avatars');
  if (!SCHEMA.hasMediaBucket) throw new Error('media bucket missing');

  const { error } = await YT.sb.storage.from('media').upload(path, file, { upsert:false, cacheControl:'3600' });
  if (error) throw error;
  const { data } = YT.sb.storage.from('media').getPublicUrl(path);
  return data.publicUrl;
}

function simpleCrudRenderer(table, opts) {
  return async (root) => {
    const orgId = STATE.profile.org_id;
    let rows = [];
    const can = opts.roles ? opts.roles.includes(STATE.profile.role) : true;
    if (opts.gate && !opts.gate(STATE.profile)) { root.innerHTML = unauthorizedState(); return; }
    root.innerHTML = `
      ${pageHeader(opts.title, opts.subtitle, can ? `<button id="crudAddBtn" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2.5 rounded-xl"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span> New</button>` : '')}
      ${opts.toolbar ? `<div class="bg-white rounded-2xl border border-slate-200 p-4 mb-5">${opts.toolbar}</div>` : ''}
      <div id="crudList" class="${opts.grid ? 'grid sm:grid-cols-2 lg:grid-cols-3 gap-4' : 'space-y-3'}"></div>`;
    async function load() {
      const list = $('#crudList'); list.innerHTML = loadingState(3);
      let q = YT.sb.from(table).select('*').eq('org_id', orgId);
      if (opts.order) q = q.order(opts.order.field, { ascending: opts.order.asc });
      if (opts.limit) q = q.limit(opts.limit);
      const { data, error } = await q;
      if (error) { list.innerHTML = errorState(error.message); return; }
      rows = data || [];
      if (!rows.length) { list.innerHTML = `<div class="${opts.grid ? 'sm:col-span-2 lg:col-span-3' : ''}">${emptyState(opts.emptyIcon||'inbox', opts.emptyTitle||'Nothing here yet', opts.emptySub||'')}</div>`; return; }
      list.innerHTML = rows.map(r => opts.renderCard(r)).join('');
      list.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(rows.find(r => r.id === b.dataset.edit))));
      list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        const row = rows.find(r => r.id === b.dataset.del);
        const ok = await confirmDialog({ title:'Delete', message: opts.deleteMessage?.(row) || `Delete this record?`, confirmLabel:'Delete', danger:true });
        if (!ok) return;
        const { error } = await YT.sb.from(table).delete().eq('id', row.id);
        if (error) { toast(error.message, 'error'); return; }
        await writeAudit('delete', table, row.id, {});
        toast('Deleted'); load();
      }));
    }
    function openForm(existing) {
      const isEdit = !!existing; const r = existing || {};
      openModal({
        title: isEdit ? 'Edit' : 'New', size:'md',
        body: opts.form(r),
        footer: `<button data-close class="px-4 py-2.5 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Cancel</button><button id="crudSave" class="px-5 py-2.5 rounded-lg font-semibold text-white bg-brand-600 hover:bg-brand-700">${isEdit?'Save':'Create'}</button>`,
        onMount: (el, close) => {
          el.querySelector('#crudSave').addEventListener('click', async () => {
            const raw = Object.fromEntries(new FormData(el.querySelector('form')));
            Object.keys(raw).forEach(k => { if (raw[k] === '') raw[k] = null; });
            const data = { org_id: orgId, ...raw };
            if (opts.beforeSave) opts.beforeSave(data, r, isEdit);
            try {
              if (isEdit) { const { error } = await YT.sb.from(table).update(data).eq('id', r.id); if (error) throw error; await writeAudit('update', table, r.id, {}); }
              else { const { data: ins, error } = await YT.sb.from(table).insert(data).select().single(); if (error) throw error; await writeAudit('create', table, ins.id, {}); }
              toast('Saved'); close(); load();
            } catch (err) { toast(err.message, 'error'); }
          });
        }
      });
    }
    if (can) $('#crudAddBtn')?.addEventListener('click', () => openForm(null));
    await load();
  };
}

SECTION_RENDERERS.tasks = async (root) => {
  const orgId = STATE.profile.org_id;
  let rows = [];
  const COLUMNS = ['To Do','In Progress','Blocked','Completed','Cancelled'];
  root.innerHTML = `${pageHeader('Tasks', 'Kanban task board', `<button id="addTaskBtn" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2.5 rounded-xl"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span> New Task</button>`)}<div id="kanban" class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-5 gap-4"></div>`;
  async function load() {
    const kb = $('#kanban'); kb.innerHTML = loadingState(3);
    const { data, error } = await YT.sb.from('tasks').select('*').eq('org_id', orgId).order('created_at',{ascending:false}).limit(300);
    if (error) { kb.innerHTML = errorState(error.message); return; }
    rows = data || [];
    kb.innerHTML = COLUMNS.map(col => {
      const items = rows.filter(r => (r.status || 'To Do') === col);
      return `<div class="bg-slate-50 rounded-2xl p-3 min-h-[180px]">
        <div class="flex items-center justify-between mb-3 px-1"><h3 class="text-sm font-bold">${col}</h3><span class="text-xs font-bold text-slate-500">${items.length}</span></div>
        <div class="space-y-2">${items.length ? items.map(tk => `<div class="bg-white rounded-xl border border-slate-200 p-3 hover:border-brand-300 cursor-pointer" data-edit="${tk.id}">
          <h4 class="font-semibold text-sm leading-snug">${escapeHtml(tk.title)}</h4>
          ${tk.assigned_to_name ? `<div class="mt-2 text-[11px] text-slate-500">${escapeHtml(tk.assigned_to_name)}</div>` : ''}
          ${tk.due_date ? `<div class="mt-1 text-[11px] ${new Date(tk.due_date) < new Date() && col !== 'Completed' ? 'text-rose-600 font-semibold' : 'text-slate-500'}">${fmtDate(tk.due_date)}</div>` : ''}
        </div>`).join('') : `<div class="text-center py-6 text-xs text-slate-400">No tasks</div>`}</div>
      </div>`;
    }).join('');
    kb.addEventListener('click', e => { const ed = e.target.closest('[data-edit]'); if (ed) openForm(rows.find(r => r.id === ed.dataset.edit)); });
  }
  function openForm(existing) {
    const isEdit = !!existing; const tk = existing || {};
    openModal({ title: isEdit ? 'Edit Task' : 'New Task', size:'md',
      body: `<form id="taskForm" class="space-y-4">
        <div><label class="block text-sm font-semibold mb-1.5">Title *</label><input name="title" value="${escapeHtml(tk.title||'')}" required class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold mb-1.5">Assigned to</label><input name="assigned_to_name" value="${escapeHtml(tk.assigned_to_name||'')}" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
          <div><label class="block text-sm font-semibold mb-1.5">Due date</label><input name="due_date" type="date" value="${tk.due_date||''}" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold mb-1.5">Priority</label><select name="priority" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-white">${['Low','Medium','High','Urgent'].map(p => `<option ${tk.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
          <div><label class="block text-sm font-semibold mb-1.5">Status</label><select name="status" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-white">${COLUMNS.map(s => `<option ${tk.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        </div>
      </form>`,
      footer: `<button data-close class="px-4 py-2.5 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Cancel</button>${isEdit ? `<button id="delTask" class="px-4 py-2.5 rounded-lg font-semibold text-rose-600 hover:bg-rose-50">Delete</button>` : ''}<button id="saveTask" class="px-5 py-2.5 rounded-lg font-semibold text-white bg-brand-600 hover:bg-brand-700">${isEdit?'Save':'Create'}</button>`,
      onMount: (el, close) => {
        el.querySelector('#saveTask').addEventListener('click', async () => {
          const data = Object.fromEntries(new FormData(el.querySelector('#taskForm')));
          if (!data.title?.trim()) { toast('Title required','error'); return; }
          data.org_id = orgId; if (!data.due_date) delete data.due_date;
          try {
            if (isEdit) { const { error } = await YT.sb.from('tasks').update(data).eq('id', tk.id); if (error) throw error; }
            else { const { error } = await YT.sb.from('tasks').insert(data); if (error) throw error; }
            toast('Saved'); close(); load();
          } catch (err) { toast(err.message,'error'); }
        });
        el.querySelector('#delTask')?.addEventListener('click', async () => {
          const ok = await confirmDialog({ title:'Delete task', message:'Delete this task?', confirmLabel:'Delete', danger:true });
          if (!ok) return;
          const { error } = await YT.sb.from('tasks').delete().eq('id', tk.id);
          if (error) { toast(error.message,'error'); return; }
          toast('Deleted'); close(); load();
        });
      }
    });
  }
  $('#addTaskBtn').addEventListener('click', () => openForm(null));
  await load();
};

SECTION_RENDERERS.finance = async (root) => {
  const allowed = ['finance_officer','ministry_admin','super_admin'];
  if (!allowed.includes(STATE.profile.role)) { root.innerHTML = unauthorizedState(); return; }
  const orgId = STATE.profile.org_id;
  let rows = [];
  root.innerHTML = `${pageHeader('Finance', 'Giving, expenses and budgets', `<button id="addTxBtn" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2.5 rounded-xl"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span> Record Transaction</button>`)}<div id="financeSummary" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-5"></div><div id="txList" class="bg-white rounded-2xl border border-slate-200 overflow-hidden"></div>`;
  async function load() {
    const list = $('#txList'); list.innerHTML = `<div class="p-5">${loadingState(6)}</div>`;
    const { data, error } = await YT.sb.from('transactions').select('*').eq('org_id', orgId).order('tx_date',{ascending:false}).limit(300);
    if (error) { list.innerHTML = errorState(error.message); return; }
    rows = data || [];
    let income = 0, expense = 0;
    rows.filter(r => r.status !== 'Reversed').forEach(r => { const a = Number(r.amount)||0; if (a>0) income+=a; else expense+=Math.abs(a); });
    $('#financeSummary').innerHTML = `
      <div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="text-2xl font-extrabold">${fmtMoney(income)}</div><div class="text-xs text-slate-500 mt-1">Income</div></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="text-2xl font-extrabold">${fmtMoney(expense)}</div><div class="text-xs text-slate-500 mt-1">Expenses</div></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5"><div class="text-2xl font-extrabold">${fmtMoney(income - expense)}</div><div class="text-xs text-slate-500 mt-1">Net</div></div>`;
    if (!rows.length) { list.innerHTML = emptyState('payments','No transactions yet','Record your first giving or expense.'); return; }
    list.innerHTML = `<div class="divide-y divide-slate-100">${rows.map(r => { const amt = Number(r.amount)||0; const pos = amt > 0; const rev = r.status === 'Reversed'; const canEdit = ['Pending','Draft'].includes(r.status);
      return `<div class="p-4 flex justify-between items-start ${rev?'opacity-60':''}">
        <div class="min-w-0 flex-1 pr-3"><div class="font-semibold text-sm truncate ${rev?'line-through':''}">${escapeHtml(r.description||r.type||'—')}</div><div class="text-xs text-slate-500 mt-0.5">${fmtDate(r.tx_date)} · ${escapeHtml(r.type||'')} · ${escapeHtml(r.status||'Pending')}</div></div>
        <div class="flex items-center gap-3"><div class="font-bold ${pos?'text-emerald-600':'text-rose-600'} ${rev?'line-through':''}">${pos?'+':'-'}${fmtMoney(Math.abs(amt))}</div>
          <div class="flex gap-1">${canEdit ? `<button data-edit="${r.id}" aria-label="Edit" class="w-8 h-8 grid place-items-center rounded-lg hover:bg-slate-100 text-slate-500"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">edit</span></button>` : ''}${!rev ? `<button data-reverse="${r.id}" aria-label="Reverse" class="w-8 h-8 grid place-items-center rounded-lg hover:bg-amber-50 text-amber-600"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">undo</span></button>` : ''}</div>
        </div></div>`;
    }).join('')}</div>`;
    list.addEventListener('click', async (e) => {
      const ed = e.target.closest('[data-edit]'); const rv = e.target.closest('[data-reverse]');
      if (ed) { const row = rows.find(r => r.id === ed.dataset.edit); if (row) openForm(row); }
      if (rv) { const row = rows.find(r => r.id === rv.dataset.reverse);
        const ok = await confirmDialog({ title:'Reverse transaction', message:'Reverse this transaction? Original record is preserved.', confirmLabel:'Reverse', danger:true });
        if (!ok) return;
        const { error } = await YT.sb.from('transactions').update({ status:'Reversed' }).eq('id', row.id);
        if (error) { toast(error.message,'error'); return; }
        await writeAudit('reverse','transaction',row.id,{ amount: row.amount }); toast('Reversed'); load();
      }
    });
  }
  function openForm(existing) {
    const INCOME = ['Tithe','Offering','Donation','Fundraising','Grant','Other Income'];
    const EXPENSE = ['Ministry Expense','Event Expense','Transport','Equipment','Media','Outreach','Administration','Other Expense'];
    const isEdit = !!existing; const r = existing || {};
    const isIncome = !r.amount || Number(r.amount) >= 0;
    if (isEdit && !['Pending','Draft'].includes(r.status)) { toast('Only pending/draft can be edited. Use Reverse.', 'info'); return; }
    openModal({
      title: isEdit ? 'Edit Transaction' : 'Record Transaction', size:'md',
      body: `<form id="txForm" class="space-y-4">
        <div class="inline-flex rounded-xl border border-slate-200 overflow-hidden w-full">
          <button type="button" data-kind="income" class="txKind flex-1 py-2.5 text-sm font-semibold ${isIncome?'bg-emerald-50 text-emerald-700':'text-slate-600'}">Income</button>
          <button type="button" data-kind="expense" class="txKind flex-1 py-2.5 text-sm font-semibold ${!isIncome?'bg-rose-50 text-rose-700':'text-slate-600'}">Expense</button>
        </div>
        <input type="hidden" name="kind" value="${isIncome?'income':'expense'}">
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold mb-1.5">Type</label><select name="type" id="txType" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-white">${(isIncome ? INCOME : EXPENSE).map(x => `<option ${r.type===x?'selected':''}>${x}</option>`).join('')}</select></div>
          <div><label class="block text-sm font-semibold mb-1.5">Amount (RWF) *</label><input name="amount_display" type="number" min="0" value="${Math.abs(Number(r.amount)||0)}" required class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
        </div>
        <div class="grid sm:grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold mb-1.5">Date *</label><input name="tx_date" type="date" value="${r.tx_date || new Date().toISOString().slice(0,10)}" required class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
          <div><label class="block text-sm font-semibold mb-1.5">Status</label><select name="status" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-white">${['Pending','Draft','Approved','Paid'].map(x => `<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
        </div>
        <div><label class="block text-sm font-semibold mb-1.5">Description</label><input name="description" value="${escapeHtml(r.description||'')}" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
      </form>`,
      footer: `<button data-close class="px-4 py-2.5 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Cancel</button><button id="saveTx" class="px-5 py-2.5 rounded-lg font-semibold text-white bg-brand-600 hover:bg-brand-700">${isEdit?'Save':'Record'}</button>`,
      onMount: (el, close) => {
        const typeSel = el.querySelector('#txType'); const kindInput = el.querySelector('[name="kind"]');
        el.querySelectorAll('.txKind').forEach(b => b.addEventListener('click', () => {
          const kind = b.dataset.kind; kindInput.value = kind;
          typeSel.innerHTML = (kind === 'income' ? INCOME : EXPENSE).map(x => `<option>${x}</option>`).join('');
          el.querySelectorAll('.txKind').forEach(x => { x.classList.remove('bg-emerald-50','text-emerald-700','bg-rose-50','text-rose-700'); x.classList.add('text-slate-600'); });
          if (kind === 'income') { b.classList.add('bg-emerald-50','text-emerald-700'); b.classList.remove('text-slate-600'); }
          else { b.classList.add('bg-rose-50','text-rose-700'); b.classList.remove('text-slate-600'); }
        }));
        el.querySelector('#saveTx').addEventListener('click', async () => {
          const fd = Object.fromEntries(new FormData(el.querySelector('#txForm')));
          const amt = Number(fd.amount_display);
          if (!amt || amt <= 0) { toast('Enter valid amount','error'); return; }
          const data = { org_id: orgId, type: fd.type, amount: fd.kind === 'income' ? amt : -amt, tx_date: fd.tx_date, description: fd.description || null, status: fd.status };
          try {
            if (isEdit) { const { error } = await YT.sb.from('transactions').update(data).eq('id', r.id); if (error) throw error; }
            else { data.created_by = STATE.profile.full_name || STATE.profile.email; const { error } = await YT.sb.from('transactions').insert(data); if (error) throw error; }
            toast('Saved'); close(); load();
          } catch (err) { toast(err.message,'error'); }
        });
      }
    });
  }
  $('#addTxBtn').addEventListener('click', () => openForm(null));
  await load();
};

SECTION_RENDERERS.approvals = async (root) => {
  if (!SCHEMA.hasApprovals) {
    root.innerHTML = pageHeader('Approvals','') + `<div class="rounded-xl bg-amber-50 border border-amber-200 p-5 text-sm text-amber-800"><p class="font-bold mb-2">Approvals table not set up.</p></div>`;
    return;
  }
  const orgId = STATE.profile.org_id;
  let rows = [];
  root.innerHTML = `${pageHeader('Approvals','Review pending items')}<div id="apList" class="space-y-3"></div>`;
  const { data, error } = await YT.sb.from('approvals').select('*').eq('org_id', orgId).eq('status','Pending').order('created_at',{ascending:false}).limit(200);
  if (error) { $('#apList').innerHTML = errorState(error.message); return; }
  rows = data || [];
  if (!rows.length) { $('#apList').innerHTML = emptyState('inbox','Nothing to review','You are all caught up.'); return; }
  $('#apList').innerHTML = rows.map(r => `<div class="bg-white rounded-2xl border border-slate-200 p-5">
    <div class="flex items-start justify-between gap-3">
      <div><h3 class="font-bold">${escapeHtml(r.title)}</h3>${r.summary ? `<p class="text-sm text-slate-600 mt-1">${escapeHtml(r.summary)}</p>` : ''}<div class="text-xs text-slate-500 mt-2">${escapeHtml(r.requested_by_name||'—')} · ${fmtDateTime(r.created_at)}${r.amount ? ' · '+fmtMoney(r.amount) : ''}</div></div>
      <div class="flex gap-1"><button data-approve="${r.id}" class="text-xs font-semibold bg-emerald-600 text-white px-3 py-2 rounded-lg">Approve</button><button data-reject="${r.id}" class="text-xs font-semibold bg-rose-50 text-rose-700 px-3 py-2 rounded-lg">Reject</button></div>
    </div></div>`).join('');
};

/* ═══════════════════════════════════════════════════════════
   DISCIPLESHIP — full multi-tab
   ═══════════════════════════════════════════════════════════ */
const DISC_TABS = [
  { k:'overview',   icon:'dashboard',       label:'Overview' },
  { k:'groups',     icon:'diversity_3',      label:'Groups' },
  { k:'unassigned', icon:'person_alert',     label:'Unassigned', manage:true },
  { k:'accounts',   icon:'badge',            label:'Accounts',   manage:true },
  { k:'sessions',   icon:'event',            label:'Sessions' },
  { k:'mygroup',    icon:'account_circle',   label:'My Group' }
];

SECTION_RENDERERS.discipleship = async (root) => {
  const allowed = DISC_TABS.filter(tb => !tb.manage || canManageDiscipleship());
  if (!allowed.some(tb => tb.k === STATE.discTab)) STATE.discTab = allowed[0].k;
  root.innerHTML = `
    ${pageHeader('Discipleship', 'Groups, mentors and growth',
      canManageDiscipleship() ? `<button id="discAddBtn" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2.5 rounded-xl"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span> New Group</button>` : '')}
    <div class="flex flex-wrap gap-2 mb-5 p-1 bg-white rounded-xl border border-slate-200 overflow-x-auto">
      ${allowed.map(tb => `<button data-dtab="${tb.k}" class="disc-tab px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 ${STATE.discTab===tb.k?'active':''}"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">${tb.icon}</span>${tb.label}</button>`).join('')}
    </div>
    <div id="discPanel"></div>`;
  root.querySelectorAll('[data-dtab]').forEach(b => b.addEventListener('click', () => {
    STATE.discTab = b.dataset.dtab;
    root.querySelectorAll('[data-dtab]').forEach(x => x.classList.toggle('active', x.dataset.dtab === STATE.discTab));
    renderDiscPanel();
  }));
  if (canManageDiscipleship()) $('#discAddBtn').addEventListener('click', () => openDiscGroupForm(null, () => { STATE.discTab = 'groups'; renderDiscPanel(); }));
  await renderDiscPanel();
};

async function renderDiscPanel() {
  const panel = $('#discPanel'); if (!panel) return;
  panel.innerHTML = loadingState(5);
  try {
    if (STATE.discTab === 'overview') await discOverview(panel);
    else if (STATE.discTab === 'groups') await discGroups(panel);
    else if (STATE.discTab === 'unassigned') await discUnassigned(panel);
    else if (STATE.discTab === 'accounts') await discAccounts(panel);
    else if (STATE.discTab === 'sessions') await discSessions(panel);
    else if (STATE.discTab === 'mygroup') await discMyGroup(panel);
  } catch (err) { console.error('[disc]', err); panel.innerHTML = errorState(err.message); }
}

async function discOverview(root) {
  const orgId = STATE.profile.org_id;
  const data = { members:0, withAccount:0, assigned:0, awaiting:0, groups:0, sessions:0 };
  const jobs = [];
  jobs.push(YT.sb.from('members').select('id', { count:'exact', head:true }).eq('org_id', orgId).then(r => data.members = r.count || 0).catch(()=>{}));
  if (SCHEMA.hasProfileId) jobs.push(YT.sb.from('members').select('id', { count:'exact', head:true }).eq('org_id', orgId).not('profile_id','is', null).then(r => data.withAccount = r.count || 0).catch(()=>{}));
  jobs.push(YT.sb.from('discipleship_groups').select('id, status').eq('org_id', orgId).then(r => { data.groups = (r.data || []).filter(g => (g.status || 'Active') !== 'Archived').length; }).catch(()=>{}));
  if (SCHEMA.hasGroupMembers) {
    jobs.push(YT.sb.from('discipleship_group_members').select('member_id').eq('org_id', orgId).eq('status','Active').then(r => { data.assigned = new Set((r.data||[]).map(x => x.member_id)).size; }).catch(()=>{}));
  }
  if (SCHEMA.hasSessions) {
    const today = new Date().toISOString().slice(0,10);
    jobs.push(YT.sb.from('discipleship_sessions').select('id', { count:'exact', head:true }).eq('org_id', orgId).gte('session_date', today).then(r => data.sessions = r.count || 0).catch(()=>{}));
  }
  await Promise.allSettled(jobs);
  data.awaiting = Math.max(0, data.members - data.assigned);
  const pct = data.members ? Math.round(data.assigned / data.members * 100) : 0;
  root.innerHTML = `
    ${!SCHEMA.hasGroupMembers ? `<div class="rounded-xl bg-amber-50 border border-amber-200 p-4 mb-5 text-sm text-amber-800">
      <p class="font-bold mb-1">Run the Discipleship migration first</p>
      <p>The full workflow needs <code class="bg-white px-1 rounded">discipleship_group_members</code>, <code class="bg-white px-1 rounded">discipleship_sessions</code>, <code class="bg-white px-1 rounded">discipleship_attendance</code> and <code class="bg-white px-1 rounded">discipleship_progress</code> tables.</p>
    </div>` : ''}
    <div class="bg-white rounded-2xl border border-slate-200 p-5 mb-5">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <div><h3 class="font-bold flex items-center gap-2"><span class="material-symbols-outlined text-brand-600" aria-hidden="true">diversity_3</span>Group Assignment Progress</h3>
        <p class="text-xs text-slate-500 mt-0.5">Every member should be assigned to a discipleship group</p></div>
        <span class="text-[11px] font-bold uppercase tracking-wider ${pct>=100?'bg-emerald-50 text-emerald-700':pct>=75?'bg-brand-50 text-brand-700':'bg-amber-50 text-amber-700'} px-3 py-1.5 rounded-full">${pct}%</span>
      </div>
      <div class="h-3 bg-slate-100 rounded-full overflow-hidden mb-2"><div class="h-full ${pct>=100?'bg-emerald-500':pct>=75?'bg-brand-500':'bg-amber-500'}" style="width:${pct}%"></div></div>
      <p class="text-sm text-slate-600"><span class="font-bold text-slate-900">${data.assigned} / ${data.members}</span> members assigned — <span class="font-semibold ${data.awaiting?'text-amber-700':'text-emerald-700'}">${data.awaiting} awaiting assignment</span></p>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
      ${discKpi('Registered members', data.members, 'group', 'brand')}
      ${discKpi('With active accounts', data.withAccount, 'badge', 'emerald')}
      ${discKpi('Active groups', data.groups, 'diversity_3', 'brand')}
      ${discKpi('Upcoming sessions', data.sessions, 'event', 'amber')}
    </div>
    ${canManageDiscipleship() && data.awaiting > 0 && SCHEMA.hasGroupMembers ? `
      <div class="bg-white rounded-2xl border border-slate-200 p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold flex items-center gap-2"><span class="material-symbols-outlined text-amber-600" aria-hidden="true">person_alert</span>Members awaiting group</h3>
          <button id="discGoQueue" class="text-xs font-semibold text-brand-600 hover:text-brand-700">Open queue →</button>
        </div>
        <div id="discAwaitingPreview">${loadingState(3)}</div>
      </div>` : ''}
  `;
  if (canManageDiscipleship() && data.awaiting > 0 && SCHEMA.hasGroupMembers) {
    $('#discGoQueue').addEventListener('click', () => { STATE.discTab = 'unassigned'; renderDiscPanel(); });
    const members = await fetchDiscUnassigned(orgId);
    $('#discAwaitingPreview').innerHTML = members.slice(0, 5).map(m => `
      <div class="flex items-center gap-3 py-2.5 border-b border-slate-100 last:border-0">
        <span class="w-9 h-9 rounded-full bg-amber-50 text-amber-700 grid place-items-center text-xs font-bold">${escapeHtml(initials(m.full_name))}</span>
        <div class="min-w-0 flex-1"><div class="font-semibold text-sm truncate">${escapeHtml(m.full_name)}</div><div class="text-xs text-slate-500 truncate">${escapeHtml(m.phone || m.email || '—')}</div></div>
        <button data-discassign="${m.id}" class="text-xs font-semibold bg-brand-600 text-white px-3 py-1.5 rounded-lg hover:bg-brand-700">Assign</button>
      </div>`).join('') || `<p class="text-sm text-slate-500">Loading…</p>`;
    $('#discAwaitingPreview').addEventListener('click', e => {
      const b = e.target.closest('[data-discassign]');
      if (b) openDiscAssignModal(members.find(x => x.id === b.dataset.discassign));
    });
  }
}
function discKpi(label, value, icon, tone) {
  const tones = { brand:'bg-brand-50 text-brand-600', emerald:'bg-emerald-50 text-emerald-600', amber:'bg-amber-50 text-amber-600' };
  return `<div class="bg-white rounded-2xl border border-slate-200 p-5"><span class="w-10 h-10 rounded-xl ${tones[tone]||tones.brand} grid place-items-center"><span class="material-symbols-outlined text-[22px]" aria-hidden="true">${icon}</span></span><div class="mt-4 text-2xl font-extrabold">${value}</div><div class="mt-1 text-xs text-slate-500 font-medium">${escapeHtml(label)}</div></div>`;
}

async function discGroups(root) {
  const orgId = STATE.profile.org_id;
  const can = canManageDiscipleship();
  root.innerHTML = `
    <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-5"><div class="flex flex-wrap gap-3 items-center">
      <div class="flex-1 min-w-[200px]">${searchBar('Search groups by name or mentor…','discGrpSearch')}</div>
      <select id="discGrpStatus" aria-label="Filter status" class="rounded-xl border border-slate-300 px-3 py-2.5 bg-white text-sm"><option value="Active">Active</option><option value="Archived">Archived</option><option value="all">All</option></select>
    </div></div>
    <div id="discGroupsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>`;
  const state = { search:'', status:'Active' };
  async function load() {
    const grid = $('#discGroupsGrid'); grid.innerHTML = loadingState(3);
    let q = YT.sb.from('discipleship_groups').select('*').eq('org_id', orgId);
    if (state.status !== 'all') q = q.eq('status', state.status);
    const { data, error } = await q.order('name').limit(300);
    if (error) { grid.innerHTML = errorState(error.message); return; }
    let rows = data || [];
    if (state.search) { const s = state.search.toLowerCase(); rows = rows.filter(r => (r.name||'').toLowerCase().includes(s) || (r.mentor_name||'').toLowerCase().includes(s)); }
    let counts = {};
    if (SCHEMA.hasGroupMembers && rows.length) {
      const ids = rows.map(r => r.id);
      const { data: gms } = await YT.sb.from('discipleship_group_members').select('group_id').in('group_id', ids).eq('status','Active');
      (gms || []).forEach(g => { counts[g.group_id] = (counts[g.group_id] || 0) + 1; });
    }
    if (!rows.length) { grid.innerHTML = `<div class="sm:col-span-2 lg:col-span-3">${emptyState('diversity_3','No groups yet','Create your first discipleship group.')}</div>`; return; }
    grid.innerHTML = rows.map(g => {
      const count = counts[g.id] || 0;
      const capacityNum = Number(g.capacity) || 0;
      const pct = capacityNum ? Math.min(100, Math.round(count/capacityNum*100)) : 0;
      return `<div class="bg-white rounded-2xl border border-slate-200 p-5 hover:border-brand-300 transition">
        <div class="flex items-start justify-between">
          <span class="w-11 h-11 rounded-xl bg-brand-50 text-brand-600 grid place-items-center"><span class="material-symbols-outlined text-[22px]" aria-hidden="true">diversity_3</span></span>
          <div class="flex gap-1">
            <button data-open="${g.id}" aria-label="Open" class="w-8 h-8 grid place-items-center rounded-lg hover:bg-slate-100 text-slate-500"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">visibility</span></button>
            ${can ? `<button data-edit="${g.id}" aria-label="Edit" class="w-8 h-8 grid place-items-center rounded-lg hover:bg-slate-100 text-slate-500"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">edit</span></button>` : ''}
          </div>
        </div>
        <h3 class="mt-4 font-bold text-lg truncate">${escapeHtml(g.name)}</h3>
        <p class="mt-1 text-sm text-slate-500 line-clamp-2 min-h-[2.5rem]">${escapeHtml(g.description || 'No description')}</p>
        <div class="mt-3 flex items-center gap-2 text-xs text-slate-500"><span class="material-symbols-outlined text-[16px]" aria-hidden="true">person</span>${escapeHtml(g.mentor_name || 'No mentor')}</div>
        ${g.meeting_schedule ? `<div class="mt-1.5 flex items-center gap-2 text-xs text-slate-500"><span class="material-symbols-outlined text-[16px]" aria-hidden="true">schedule</span>${escapeHtml(g.meeting_schedule)}</div>` : ''}
        <div class="mt-4 pt-4 border-t border-slate-100">

async function fetchDiscUnassigned(orgId) {
  if (!SCHEMA.hasGroupMembers) {
    const { data } = await YT.sb.from('members').select('id, full_name, phone, email, account_status').eq('org_id', orgId).limit(2000);
    return data || [];
  }
  const { data: assigned } = await YT.sb.from('discipleship_group_members').select('member_id').eq('org_id', orgId).eq('status','Active');
  const assignedSet = new Set((assigned || []).map(x => x.member_id));
  const { data: all } = await YT.sb.from('members').select('id, full_name, phone, email, account_status, profile_id').eq('org_id', orgId).limit(2000);
  return (all || []).filter(m => !assignedSet.has(m.id));
}

  if (!canManageDiscipleship()) { root.innerHTML = unauthorizedState(); return; }

  const orgId = STATE.profile.org_id;
  const state = { search:'', selected:new Set(), rows:[] };
  root.innerHTML = `
    <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-5">

        <span id="discUqCount" class="text-xs text-slate-500 font-medium ml-auto"></span>
      </div>
    </div>
    <div id="discUqTable" class="bg-white rounded-2xl border border-slate-200 overflow-hidden"></div>`;
  async function load() {
    const wrap = $('#discUqTable'); wrap.innerHTML = `<div class="p-5">${loadingState(6)}</div>`;

    state.rows = state.search ? all.filter(m => (m.full_name||'').toLowerCase().includes(state.search.toLowerCase()) || (m.phone||'').includes(state.search) || (m.email||'').toLowerCase().includes(state.search.toLowerCase())) : all;

  function render() {
    const wrap = $('#discUqTable');
    $('#discUqCount').textContent = `${state.rows.length} member${state.rows.length===1?'':'s'} awaiting assignment`;
    $('#discSelCount').textContent = String(state.selected.size);

    if (!state.rows.length) { wrap.innerHTML = emptyState('check_circle','All members assigned','Every member has been assigned.'); return; }
    wrap.innerHTML = `<div class="divide-y divide-slate-100">
      ${state.rows.map(m => { const sel = state.selected.has(m.id);
        return `<div class="p-4 flex items-center gap-3">
          <input type="checkbox" data-dsel="${m.id}" ${sel?'checked':''} aria-label="Select ${escapeHtml(m.full_name||'member')}" class="w-4 h-4 rounded border-slate-300">
          <span class="w-10 h-10 rounded-full bg-amber-50 text-amber-700 grid place-items-center text-xs font-bold">${escapeHtml(initials(m.full_name))}</span>
          <div class="min-w-0 flex-1"><div class="font-semibold text-sm truncate">${escapeHtml(m.full_name)}</div><div class="text-xs text-slate-500 truncate">${escapeHtml(m.phone || m.email || '—')}</div></div>
          <button data-discassign="${m.id}" class="text-xs font-semibold bg-brand-600 text-white px-3 py-1.5 rounded-lg">Assign</button>
        </div>`; }).join('')}
    </div>`;
    wrap.querySelectorAll('[data-dsel]').forEach(cb => cb.addEventListener('change', () => { const id = cb.dataset.dsel; if (cb.checked) state.selected.add(id); else state.selected.delete(id); render(); }));
    wrap.querySelectorAll('[data-discassign]').forEach(b => b.addEventListener('click', () => openDiscAssignModal(state.rows.find(x => x.id === b.dataset.discassign))));
  }
  $('#discUqSearch').addEventListener('input', debounce(e => { state.search = e.target.value.trim(); load(); }, 250));
  $('#discSelectAllBtn').addEventListener('click', () => { state.rows.forEach(m => state.selected.add(m.id)); render(); });

  $('#discBulkBtn').addEventListener('click', () => openDiscBulkAssignModal(state.rows.filter(m => state.selected.has(m.id)), () => { state.selected.clear(); load(); }));

async function openDiscAssignModal(member, options = {}) {
  const orgId = STATE.profile.org_id;
  const { data: groups } = await YT.sb.from('discipleship_groups').select('id, name, mentor_name').eq('org_id', orgId).eq('status','Active').order('name');

      ${member ? `<div class="rounded-xl border border-slate-200 p-3 flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-brand-100 text-brand-700 grid place-items-center text-xs font-bold">${escapeHtml(initials(member.full_name))}</span><div class="min-w-0"><div class="font-semibold text-sm">${escapeHtml(member.full_name)}</div><div class="text-xs text-slate-500">${escapeHtml(member.phone || member.email || '—')}</div></div></div>` : ''}
      ${!list.length ? `<div class="rounded-xl bg-amber-50 border border-amber-200 p-4 text-sm text-amber-800">No active groups yet.</div>` : `
        <div><label class="block text-sm font-semibold mb-1.5">Select discipleship group *</label>
          <select id="discAssignG" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-white">${member ? '<option value="">— Choose a group —</option>' : ''}${list.map(g => `<option value="${g.id}">${escapeHtml(g.name)}${g.mentor_name?` · ${escapeHtml(g.mentor_name)}`:''}</option>`).join('')}</select></div>
        <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" id="discAssignPrimary" checked class="w-4 h-4"><span class="text-sm">Make this their primary discipleship group</span></label>
      `}
    </div>`,
    footer: list.length ? `<button data-close class="px-4 py-2.5 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Cancel</button><button id="doDiscAssign" class="px-5 py-2.5 rounded-lg font-semibold text-white bg-brand-600 hover:bg-brand-700">Assign</button>` : `<button data-close class="px-4 py-2.5 rounded-lg font-semibold text-slate-700 hover:bg-slate-100">Close</button>`,
    onMount: (el, close) => {
      el.querySelector('#doDiscAssign')?.addEventListener('click', async () => {
        const sel = el.querySelector('#discAssignG');
        const gid = sel.value;
        if (!gid) { toast('Choose a group','error'); return; }
        const primary = el.querySelector('#discAssignPrimary').checked;
        const members = member ? [member] : [];
        const btn = el.querySelector('#doDiscAssign'); btn.disabled = true; btn.textContent = 'Assigning…';
        try {
          let n = 0;
          for (const mem of members) {
            const { data: existing } = await YT.sb.from('discipleship_group_members').select('id').eq('member_id', mem.id).eq('group_id', gid).eq('status','Active').maybeSingle();
            if (existing) continue;
            if (primary) {
              const { data: cur } = await YT.sb.from('discipleship_group_members').select('id').eq('member_id', mem.id).eq('status','Active').eq('is_primary', true);
              for (const cp of cur || []) await YT.sb.from('discipleship_group_members').update({ is_primary:false }).eq('id', cp.id);
            }
            const { error } = await YT.sb.from('discipleship_group_members').insert({
              org_id: orgId, group_id: gid, member_id: mem.id, is_primary: primary, status:'Active',
              joined_at: new Date().toISOString(), assigned_by: STATE.profile.id,
              assigned_by_name: STATE.profile.full_name || STATE.profile.email
            });
            if (!error) n++;
          }
          await writeAudit('assign_group', 'discipleship_group_members', null, { members: members.length, group_id: gid });
          toast(`Assigned ${n}`);
          close(); renderDiscPanel();
        } catch (err) { toast(err.message,'error'); }
        finally { btn.disabled = false; btn.textContent = 'Assign'; }
      });
    }
  });
}

    errEl.classList.add('hidden');
    btn.disabled = true; btn.textContent = 'Creating workspace…';
    try {
      await createMinistryForOAuthUser(session.user, fullName, ministryName);
      if (history.replaceState) history.replaceState(null, '', window.location.pathname);
      window.location.reload();
    } catch (err) {

async function createMinistryForOAuthUser(user, fullName, ministryName) {
  const sb = YT.sb;
  let orgId = null;
  const { data: existing } = await sb.from('profiles').select('id, org_id').eq('id', user.id).maybeSingle();
  if (existing?.org_id) orgId = existing.org_id;
  if (!orgId) {
    const { data: owned } = await sb.from('organizations').select('id').eq('created_by', user.id).limit(1);
    if (owned?.length) orgId = owned[0].id;
  }
  if (!orgId) {
    const { data: newOrg, error } = await sb.from('organizations').insert({ name: ministryName, created_by: user.id, created_at: new Date().toISOString() }).select('id').single();
    if (error) throw new Error('Could not create ministry: ' + error.message);
    orgId = newOrg.id;
  }
  if (!existing || !existing.org_id) {
    const { error } = await sb.from('profiles').upsert({ id: user.id, org_id: orgId, role: 'ministry_admin', full_name: fullName, email: user.email, status: 'active', created_at: new Date().toISOString() });
    if (error) throw new Error('Could not create profile: ' + error.message);
  }
  try {
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const bytes = new Uint8Array(8);
    crypto.getRandomValues(bytes);
    let code = '';
    for (let i = 0; i < 8; i++) code += alphabet[bytes[i] % alphabet.length];
    await sb.from('organizations').update({ join_code: code, join_code_rotated_at: new Date().toISOString() }).eq('id', orgId);
  } catch (_) {}
}

      document.getElementById('bootScreen').innerHTML = `<div class="text-center max-w-sm px-6">
        <span class="w-14 h-14 rounded-2xl bg-amber-50 text-amber-600 grid place-items-center mx-auto"><span class="material-symbols-outlined text-[28px]" aria-hidden="true">hourglass_top</span></span>
        <h2 class="mt-5 font-bold text-lg">Awaiting approval</h2>
        <p class="mt-2 text-sm text-slate-500">Your membership request is being reviewed by the ministry administrators. You'll be notified by email once approved.</p>
        <button onclick="YT.signOut()" class="mt-6 bg-slate-800 hover:bg-slate-900 text-white font-semibold px-5 py-2.5 rounded-xl text-sm">Sign out</button>
      </div>`;
      return;
    }
  } catch (_) {}

  if (['suspended','disabled'].includes(STATE.profile.status)) { await YT.sb.auth.signOut(); window.location.replace('/login.html'); return; }
  await detectSchema();
  await detectMemberColumns();

  if (SCHEMA.avatarCol) {
    try {
      const { data: av } = await YT.sb
        .from('profiles')
        .select(SCHEMA.avatarCol)
        .eq('id', STATE.profile.id)
        .maybeSingle();
      if (av) STATE.profile[SCHEMA.avatarCol] = av[SCHEMA.avatarCol];
    } catch (err) {
      console.warn('[boot] avatar column fetch failed:', err?.message);
    }
  }

  if (STATE.profile.preferences?.language) { CURRENT_LANG = STATE.profile.preferences.language; $('#langLabel').textContent = CURRENT_LANG.toUpperCase(); }
  renderSidebar();
  $('#bootScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  const firstNav = getNavItems()[0]?.key || 'dashboard';
  await navigate(firstNav);
  attachMessagingListeners();
  const profileMenu = $('#profileMenu');
  const openPM = (a) => { const r = a.getBoundingClientRect(); profileMenu.style.top = (r.bottom+8)+'px'; profileMenu.style.left = Math.max(8, r.right-256)+'px'; profileMenu.classList.remove('hidden'); };
  const closePM = () => profileMenu.classList.add('hidden');
  $('#profileBtn')?.addEventListener('click', e => { e.stopPropagation(); openPM(e.currentTarget); });
  $('#topProfileBtn')?.addEventListener('click', e => { e.stopPropagation(); openPM(e.currentTarget); });
  document.addEventListener('click', closePM);
  profileMenu.addEventListener('click', e => e.stopPropagation());
  profileMenu.querySelectorAll('[data-menu]').forEach(b => b.addEventListener('click', async () => { closePM(); const a = b.dataset.menu; if (a==='settings') navigate('settings'); else if (a==='logout') { const ok = await confirmDialog({ title:'Sign out', message:t('auth.logoutConfirm'), confirmLabel:'Sign out', danger:true }); if (ok) { try { await presenceChannel?.untrack(); } catch(_){} YT.signOut(); } } }));
  $('#hamburger').addEventListener('click', openDrawer);
  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#drawerBackdrop').addEventListener('click', closeDrawer);
  $('#langToggle').addEventListener('click', () => { CURRENT_LANG = CURRENT_LANG === 'en' ? 'rw' : 'en'; localStorage.setItem('yt_language', CURRENT_LANG); $('#langLabel').textContent = CURRENT_LANG.toUpperCase(); renderSidebar(); markActiveNav(STATE.currentSection); navigate(STATE.currentSection); });
  $('#searchTrigger').addEventListener('click', openGlobalSearch);
  const updateOnline = () => { const off = !navigator.onLine; $('#offlineBanner').classList.toggle('hidden', !off); };
  window.addEventListener('online', updateOnline); window.addEventListener('offline', updateOnline); updateOnline();
  document.addEventListener('keydown', e => { if (e.key==='Escape') { closeDrawer(); closePM(); closeSearch(); } if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); if (STATE.profile) openGlobalSearch(); } });
}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
boot().catch(err => { console.error('[boot]', err); document.getElementById('bootScreen').innerHTML = `<div class="text-center max-w-sm px-6"><span class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-500 grid place-items-center mx-auto"><span class="material-symbols-outlined text-[28px]" aria-hidden="true">error</span></span><h2 class="mt-5 font-bold text-lg">Could not load workspace</h2><p class="mt-2 text-sm text-slate-500">${escapeHtml(err.message || 'Please refresh.')}</p><button onclick="location.reload()" class="mt-6 bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm">Retry</button></div>`; });
</script>
</body>
</html>
